<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omah Les - Portal Belajar Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .dashboard-main-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 900px) {
            .dashboard-main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- LOGIN PAGE CONTAINER -->
    <div id="loginPage" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            <div class="text-center mb-8">
                <span class="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Portal Omah Les</span>
                <h2 class="text-2xl font-extrabold text-slate-900 mt-3">Masuk ke Portal Belajar</h2>
                <p class="text-sm text-slate-500 mt-1">Silakan masukkan email orang tua dan pilih paket belajar siswa.</p>
            </div>
            
            <form id="formLogin" onsubmit="handleFormLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Email Orang Tua / Wali</label>
                    <input type="email" id="inputParentEmail" required placeholder="contoh: orangtua@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Pilih Paket / Jenjang</label>
                    <select id="inputPackageSelect" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                        <option value="tk">Paket TK (Taman Kanak-Kanak)</option>
                        <option value="sd_1_3">Paket SD Kelas 1 - 3</option>
                        <option value="sd_4_6">Paket SD Kelas 4 - 6</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all text-sm">
                    Masuk Portal
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md">OL</div>
                    <div>
                        <h1 class="font-extrabold text-lg text-slate-900 leading-none">Omah Les</h1>
                        <span id="headerPackageBadge" class="text-xs font-bold text-indigo-600">Portal Siswa</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="openSettingsModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition-all">
                        ⚙️ Pengaturan Paket
                    </button>
                    <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-semibold text-xs transition-all">
                        Keluar
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
            <div id="mainDynamicContent">
                <!-- Dashboard Content Default -->
            </div>
        </main>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-900 mb-4">Pengaturan Paket Belajar</h3>
            <div class="mb-4">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Ubah Paket / Jenjang</label>
                <select id="settingsPackageSelect" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                    <option value="tk">Paket TK (Taman Kanak-Kanak)</option>
                    <option value="sd_1_3">Paket SD Kelas 1 - 3</option>
                    <option value="sd_4_6">Paket SD Kelas 4 - 6</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeSettingsModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl">Batal</button>
                <button onclick="changePackageFromSettings(document.getElementById('settingsPackageSelect').value)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT APLIKASI -->
    <script>
        // Data Materi TK, Flashcard, dan Bank Soal Terintegrasi
        const TK_MATERI_DATA = {

                    { "tahap": "Menengah", "penjelasan": "Melafalkan doa harian pendek, membedakan perbuatan baik-buruk dalam contoh sehari-hari.",[cite: 3], "aktivitas": ["Ajarkan satu doa pendek (misalnya doa makan atau doa tidur) dan ulangi bersama setiap hari di waktu yang sama.", "Gunakan cerita atau boneka tangan untuk menampilkan dua situasi — satu perbuatan baik, satu kurang baik — lalu tanyakan pendapat anak.", "Puji secara spesifik saat anak melakukan hal baik, misalnya 'Terima kasih ya sudah mau berbagi mainan.'"] },[cite: 3]

                  "tahapan": [

                    { "tahap": "Menengah", "penjelasan": "Melompat dengan koordinasi, melempar-menangkap bola, meronce manik besar, menjiplak garis.",[cite: 3], "aktivitas": ["Main lempar-tangkap bola kecil atau balon dari jarak dekat, perlahan tambah jaraknya.", "Sediakan manik-manik besar atau pasta berlubang dan tali untuk dironce.", "Gambar garis lurus, zig-zag, dan lengkung di kertas, minta anak menjiplaknya dengan pensil."] },[cite: 3]
                    { "tahap": "Mahir", "penjelasan": "Gerak kasar terkoordinasi (melompat sambil berputar, dsb.), motorik halus matang untuk pra-menulis (memegang pensil dengan benar, menjiplak bentuk kompleks).",[cite: 3], "aktivitas": ["Buat rintangan sederhana di rumah (bantal, kursi) untuk dilewati dengan melompat dan berputar.", "Latih cara memegang pensil yang benar (jepitan tiga jari) saat mewarnai atau menulis.", "Sediakan bentuk-bentuk seperti bintang atau spiral untuk dijiplak dan diwarnai."] }[cite: 3]

                    { "tahap": "Menengah", "penjelasan": "Membandingkan ukuran (besar-kecil, panjang-pendek), mengurutkan benda/pola sederhana, mulai memecahkan masalah sederhana.",[cite: 3], "aktivitas": ["Susun sendok atau pensil dari yang terpendek ke terpanjang.", "Buat pola sederhana dengan kancing atau balok (merah-biru-merah-biru) dan minta anak melanjutkannya.", "Beri tantangan kecil, misalnya 'Bagaimana caranya memindahkan air dari gelas ini ke gelas itu tanpa tumpah?'"] },[cite: 3]
                    { "tahap": "Mahir", "penjelasan": "Mengklasifikasi benda berdasar lebih dari satu ciri, menyelesaikan masalah dengan mencoba beberapa cara, memahami sebab-akibat sederhana.",[cite: 3], "aktivitas": ["Minta anak mengelompokkan mainan berdasarkan warna DAN ukuran sekaligus.", "Beri masalah sederhana (misalnya menara balok yang roboh) dan biarkan anak mencoba beberapa cara sebelum dibantu.", "Diskusikan sebab-akibat dari kejadian sehari-hari, misalnya 'Kenapa ya lantainya basah setelah hujan masuk lewat jendela?'"] }[cite: 3]

                    { "tahap": "Mahir", "penjelasan": "Berbicara runtut menjelaskan pengalaman sendiri, mengenal literasi awal (menghubungkan huruf-bunyi-kata sederhana).",[cite: 3], "aktivitas": ["Ajak anak bercerita tentang kegiatannya hari ini secara berurutan (pertama, lalu, terakhir).", "Latih menyambung bunyi huruf jadi kata sederhana, misalnya 'b-o-l-a jadi bola'.", "Buat 'buku cerita' sederhana dari gambar anak sendiri, lalu minta ia menjelaskan isinya."] }[cite: 3]

                },
                { "id": "sosial-emosional", "kategori": "Sosial-Emosional", "icon": "❤️",[cite: 3]

                  ]

                    { "tahap": "Menengah", "penjelasan": "Menggambar bentuk yang mulai terlihat (orang, rumah sederhana), bernyanyi dengan gerakan sesuai lirik.",[cite: 3], "aktivitas": ["Minta anak menggambar anggota keluarga atau rumahnya sendiri.", "Ajarkan lagu dengan gerakan tangan yang sesuai lirik (misalnya 'Kepala Pundak Lutut Kaki').", "Sediakan bahan daur ulang (kardus, tutup botol) untuk berkreasi bebas."] },[cite: 3]

                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div style="background:white; border:2px solid #e2e8f0; border-radius:1rem; padding:20px; display:flex; align-items:center; justify-content:space-between;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <span style="font-size:2.2rem;">🔥</span>
                                <div>
                                    <div style="font-family:'Fredoka',sans-serif; font-size:1rem; color:#1e293b;">Streak Konsisten</div>
                                    <div style="font-size:0.75rem; color:#64748b; font-weight:700;">${meta.title}</div>
                                </div>
                            </div>
                            <div style="background:#ffedd5; color:#c2410c; padding:6px 12px; border-radius:2rem; font-weight:800; font-size:0.8rem;">🔥 1 Hari</div>
                        </div>

                        <div style="background:white; border:2px solid #e2e8f0; border-radius:1rem; padding:20px;">
                            <div style="font-family:'Fredoka',sans-serif; font-size:1.1rem; color:#451a03; margin-bottom:4px;">🎯 Misi Mingguan</div>
                            <div style="font-size:0.78rem; color:#78350f; font-weight:700; margin-bottom:12px;">Selesaikan 3 kuis atau modul.</div>
                            <div style="background:#fef3c7; padding:10px 14px; border-radius:0.75rem; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-family:'Fredoka',sans-serif; font-size:0.88rem; color:#92400e;">3 Aktivitas</div>
                                    <div style="font-size:0.72rem; color:#b45309; font-weight:700;">Progress: ${Math.min(userCompletedQuizzes, 3)} / 3</div>
                                </div>
                                <button ${(!questDone || weeklyQuestClaimed) ? 'disabled' : ''} onclick="alert('Misi diklaim!')" style="background:#d97706; color:white; border:none; padding:6px 12px; border-radius:0.5rem; font-weight:700; cursor:pointer;">
                                    ${weeklyQuestClaimed ? '✅ Klaim' : (questDone ? '🎁 +150 ⭐' : 'Belum')}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div style="background:linear-gradient(135deg,#fef3c7,#fde68a); border:2px solid #fcd34d; border-radius:1rem; padding:20px; display:flex; align-items:center; justify-content:space-between;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <div style="font-size:2.2rem;">🎁</div>
                                <div>
                                    <div style="font-family:'Fredoka',sans-serif; font-size:1.1rem; color:#92400e; margin-bottom:2px;">Bintang Harian</div>
                                    <div style="font-size:0.78rem; font-weight:700; color:#b45309;">Klaim +50 bintang gratis!</div>
                                </div>
                            </div>
                            <button ${isAlreadyClaimed ? 'disabled' : ''} onclick="lastClaimDate='${todayStr}'; userStars+=50; renderDashboardMain(document.getElementById('mainDynamicContent'));" style="background:#d97706; color:white; border:none; padding:10px 16px; border-radius:0.75rem; font-weight:700; cursor:pointer;">
                                ${isAlreadyClaimed ? '✅ Selesai' : '✨ Klaim 50⭐'}
                            </button>
                        </div>

                        <div style="background:white; border:2px solid #e2e8f0; border-radius:1rem; padding:20px; display:flex; align-items:center; gap:16px;">
                            <div style="width:48px; height:48px; background:#fef9c3; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.5rem;">⭐</div>
                            <div>
                                <div style="font-size:0.8rem; color:#64748b; font-weight:700;">Total Bintang & Aktivitas</div>
                                <div style="font-size:1.3rem; font-weight:800; color:#1e293b;">${userStars} ⭐ | ${userCompletedQuizzes} Selesai</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Info Materi Terintegrasi -->
                <div style="background:white; border:2px solid #e2e8f0; border-radius:1rem; padding:24px;">
                    <h3 style="font-family:'Fredoka',sans-serif; font-size:1.2rem; margin-bottom:12px; color:#1e293b;">📚 Modul Materi & Bank Soal TK Aktif</h3>
                    <p style="font-size:0.9rem; color:#64748b; margin-bottom:16px;">${TK_MATERI_DATA.judul_halaman}[cite: 3]</p>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">
                        ${TK_MATERI_DATA.materi_belajar.map(m => `
                            <div style="background:#f8fafc; border:1px solid #e2e8f0; padding:14px; border-radius:0.75rem;">
                                <div style="font-size:1.5rem; margin-bottom:6px;">${m.icon}</div>
                                <div style="font-weight:700; font-size:0.95rem; color:#1e293b; margin-bottom:4px;">${m.kategori}</div>
                                <div style="font-size:0.78rem; color:#64748b; line-height:1.4;">${m.deskripsi_singkat}[cite: 3]</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openSettingsModal() {
            document.getElementById('settingsPackageSelect').value = currentPackage;
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('flex');
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function handleLogout() {
            sessionStorage.removeItem('omahles_portal_active_student');
            location.reload();
        }

        function handleFormLogin(e) {
            e.preventDefault();
            const pEmail = document.getElementById('inputParentEmail').value.trim().toLowerCase();
            const selPkg = document.getElementById('inputPackageSelect').value;
            
            if (REGISTERED_PARENT_DATABASE[pEmail]) {
                const data = REGISTERED_PARENT_DATABASE[pEmail];
                if (data.defaultPkg !== selPkg && !data.isAdmin) {
                    alert(`❌ Maaf, email ${pEmail} terdaftar untuk paket ${packageMeta[data.defaultPkg].title}. Anda tidak dapat mengakses jenjang yang berbeda.`);
                    return;
                }
                currentPackage = data.isAdmin ? selPkg : data.defaultPkg;
                currentStudent = { name: data.name, parentEmail: pEmail, pkg: currentPackage };
            } else {
                currentPackage = selPkg;
                const generatedName = pEmail.split('@')[0].toUpperCase();
                currentStudent = { name: `Ananda ${generatedName}`, parentEmail: pEmail, pkg: currentPackage };
            }
            
            sessionStorage.setItem('omahles_portal_active_student', JSON.stringify(currentStudent));
            document.getElementById('loginPage').style.display = 'none';
            applyPackageThemeToSidebar();
        }

        function changePackageFromSettings(pkgVal) {
            const pEmail = currentStudent.parentEmail;
            if (REGISTERED_PARENT_DATABASE[pEmail] && !REGISTERED_PARENT_DATABASE[pEmail].isAdmin) {
                const registeredPkg = REGISTERED_PARENT_DATABASE[pEmail].defaultPkg;
                if (registeredPkg !== pkgVal) {
                    alert(`❌ Akun Anda terdaftar khusus untuk ${packageMeta[registeredPkg].title}. Anda tidak diizinkan mengubah ke jenjang lain.`);
                    document.getElementById('settingsPackageSelect').value = currentPackage;
                    return;
                }
            }

            currentPackage = pkgVal;
            currentStudent.pkg = currentPackage;
            sessionStorage.setItem('omahles_portal_active_student', JSON.stringify(currentStudent));
            applyPackageThemeToSidebar();
            closeSettingsModal();
            alert(`✅ Paket berhasil diubah ke: ${packageMeta[currentPackage].title}`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = sessionStorage.getItem('omahles_portal_active_student');
            if (saved) {
                currentStudent = JSON.parse(saved);
                currentPackage = currentStudent.pkg;
                document.getElementById('loginPage').style.display = 'none';
                applyPackageThemeToSidebar();
            }
        });
    </script>
</body>
</html>
