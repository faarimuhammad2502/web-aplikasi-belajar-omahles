<script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        function playClickSound() { playTone(440, 'sine', 0.08); }
        function playSuccessSound() { 
            setTimeout(() => playTone(523.25, 'triangle', 0.1), 0);
            setTimeout(() => playTone(659.25, 'triangle', 0.1), 100);
            setTimeout(() => playTone(783.99, 'triangle', 0.2), 200);
        }
        function playErrorSound() { playTone(180, 'sawtooth', 0.25); }

        // BGM AUDIO PLAYER SETUP
        // Menggunakan link instrumen musik latar yang lembut dan menenangkan untuk belajar
        const bgmAudio = new Audio('https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg'); 
        bgmAudio.loop = true;
        bgmAudio.volume = 0.25; // Volume diatur pas agar tidak menutupi suara TTS/interaksi
        let isBgmPlaying = false;

        function toggleBgmMusic() {
            playClickSound();
            isBgmPlaying = !isBgmPlaying;
            const btn = document.getElementById('btnToggleBgm');
            if (isBgmPlaying) {
                btn.innerText = '🎵 Musik BGM: ON';
                bgmAudio.play().catch(err => {
                    console.log("Autoplay dicegah browser, klik sekali lagi untuk memutar.");
                });
            } else {
                btn.innerText = '🎵 Musik BGM: OFF';
                bgmAudio.pause();
            }
        }

        function toggleDarkMode() {
            playClickSound();
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('omahles_dark_mode', isDark ? 'true' : 'false');
        }

        let activeSpeakingButton = null;

        function toggleSpeech(textString, btnElement) {
            if (!('speechSynthesis' in window)) {
                alert("Maaf, browser Anda tidak mendukung fitur suara baca teks.");
                return;
            }

            if (window.speechSynthesis.speaking && activeSpeakingButton === btnElement) {
                window.speechSynthesis.cancel();
                if (activeSpeakingButton) {
                    activeSpeakingButton.classList.remove('playing');
                }
                activeSpeakingButton = null;
                return;
            }

            window.speechSynthesis.cancel();
            if (activeSpeakingButton) {
                activeSpeakingButton.classList.remove('playing');
            }

            const utterance = new SpeechSynthesisUtterance(textString);
            utterance.lang = 'id-ID';
            utterance.rate = 0.9;

            activeSpeakingButton = btnElement;
            btnElement.classList.add('playing');

            utterance.onend = () => {
                if (activeSpeakingButton === btnElement) {
                    btnElement.classList.remove('playing');
                    activeSpeakingButton = null;
                }
            };

            utterance.onerror = () => {
                if (activeSpeakingButton === btnElement) {
                    btnElement.classList.remove('playing');
                    activeSpeakingButton = null;
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function toggleMobileSidebar() {
            playClickSound();
            document.getElementById('appSidebar').classList.toggle('mobile-open');
        }

        let currentPetAccessory = localStorage.getItem('omahles_pet_accessory') || '';
        function changeVirtualPet(petEmoji) {
            playClickSound();
            localStorage.setItem('omahles_virtual_pet', petEmoji);
            updatePetDisplayUI();
        }

        function updatePetDisplayUI() {
            const petEmoji = localStorage.getItem('omahles_virtual_pet') || '🐱';
            const acc = currentPetAccessory || '';
            const fullDisplay = acc ? `${petEmoji}${acc}` : petEmoji;
            document.getElementById('virtualPetDisplay').innerText = fullDisplay;
            document.getElementById('sidebarAvatarIcon').innerText = fullDisplay;
        }

        function buyPetAccessory(accSymbol, cost) {
            if(userStars < cost) {
                playErrorSound();
                alert(`⭐ Bintang tidak cukup! Kamu butuh ${cost} bintang untuk membeli aksesoris ini.`);
                return;
            }
            playSuccessSound();
            userStars -= cost;
            currentPetAccessory = accSymbol;
            localStorage.setItem('omahles_user_stars', userStars);
            localStorage.setItem('omahles_pet_accessory', currentPetAccessory);
            updatePetDisplayUI();
            renderDashboardData();
            renderDashboardMain(document.getElementById('dynamicMainContentArea'));
            alert(`🎉 Hore! Aksesoris ${accSymbol} berhasil dipasang ke maskot virtualmu!`);
        }
        
        // ... (fungsi aplikasi lainnya tetap sama seperti sebelumnya)
    </script>
